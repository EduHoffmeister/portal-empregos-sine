{% extends "base.html" %}
{% block title %}Acesso administrativo | Portal de Empregos SINE{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="auth-card" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="auth-icon">♙</div>
    <span class="eyebrow blue">ACESSO RESTRITO</span>
    <h1>Área administrativa</h1>
    <p>Entre com suas credenciais para gerenciar as vagas publicadas.</p>
    <label>Usuário<input name="username" autocomplete="username" required maxlength="80"></label>
    <label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary-button full" type="submit">Entrar no painel</button>
    <a class="back-link centered" href="{{ url_for('home') }}">Voltar ao portal público</a>
  </form>
</div>
{% endblock %}
